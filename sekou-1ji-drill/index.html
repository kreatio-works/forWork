<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2級建築施工管理技士 第一次検定 演習ドリル</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#F85911">
<style>
:root{
  --paper:#F6F8FA;
  --grid:#E2EAF1;
  --ink:#1E3A52;
  --line:#8FA8BC;
  --sub:#5B7386;
  --accent:#C6492C;   /* 朱・検印 */
  --ok:#2C7A57;
  --card:#FFFFFF;
  --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

/* ── 表題欄（図面枠風ヘッダー） ── */
.titleblock{
  border:2px solid var(--ink);
  background:var(--card);
  margin:16px 0 20px;
  display:grid;
  grid-template-columns:1fr auto;
}
.titleblock .name{padding:12px 14px;border-right:1px solid var(--ink)}
.titleblock .name .small{font-size:.68rem;letter-spacing:.14em;color:var(--sub);font-family:var(--mono)}
.titleblock .name h1{font-size:1.02rem;font-weight:700;line-height:1.45;margin-top:3px}
.titleblock .no{
  display:flex;flex-direction:column;justify-content:space-between;
  padding:10px 12px;min-width:88px;text-align:right;font-family:var(--mono)
}
.titleblock .no .dwg{font-size:.62rem;color:var(--sub);letter-spacing:.1em}
.titleblock .no .num{font-size:1.05rem;font-weight:700;color:var(--accent)}
.titleblock .no .date{font-size:.62rem;color:var(--sub)}

/* ── 寸法線風の進捗表示 ── */
.dim{margin:6px 2px 18px;font-family:var(--mono)}
.dim .dimline{position:relative;height:14px}
.dim .dimline::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line)}
.dim .dimline::after{content:"";position:absolute;right:0;top:2px;width:1px;height:11px;background:var(--line)}
.dim .dimline .tick{position:absolute;left:0;top:2px;width:1px;height:11px;background:var(--line)}
.dim .dimline .fill{position:absolute;left:0;top:6px;height:3px;background:var(--accent);transition:width .25s}
.dim .label{font-size:.66rem;color:var(--sub);text-align:center;margin-top:2px;letter-spacing:.06em}

/* ── 分野カード ── */
.cat{
  background:var(--card);
  border:1.5px solid var(--ink);
  margin-bottom:14px;
  padding:14px 14px 12px;
  cursor:pointer;
  position:relative;
}
.cat:active{transform:translate(1px,1px)}
.cat .rank{
  position:absolute;top:-9px;left:12px;
  background:var(--accent);color:#fff;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;
  padding:2px 8px;font-weight:700;
}
.cat .rank.b{background:var(--sub)}
.cat h2{font-size:.98rem;margin:4px 0 4px}
.cat .meta{font-size:.72rem;color:var(--sub);line-height:1.6}
.cat .meta b{color:var(--accent);font-weight:700}
.cat .stat{
  font-family:var(--mono);font-size:.7rem;color:var(--sub);
  margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;
  display:flex;justify-content:space-between;
}
.cat .stat .done{color:var(--ok);font-weight:700}

/* ── 出題モード選択 ── */
.modecard{background:var(--card);border:1.5px solid var(--ink);padding:16px 14px;margin-bottom:14px}
.modecard h2{font-size:1rem;margin-bottom:4px}
.modecard .meta{font-family:var(--mono);font-size:.72rem;color:var(--sub);margin-bottom:12px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.modebtn{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:700;padding:13px 12px;margin-bottom:9px;cursor:pointer;font-size:.9rem}
.modebtn:active{transform:translate(1px,1px)}
.modebtn .sub{display:block;font-weight:400;font-size:.72rem;color:var(--sub);margin-top:3px;line-height:1.5}
.modebtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.modebtn.primary .sub{color:#C9D6E0}

/* ── 出題画面 ── */
.qhead{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:.72rem;color:var(--sub);margin-bottom:8px;letter-spacing:.06em;
}
.qhead .catname{color:var(--ink);font-weight:700}
.qcard{background:var(--card);border:1.5px solid var(--ink);padding:16px 14px}
.qcard .form{
  display:inline-block;font-family:var(--mono);font-size:.64rem;
  border:1px solid var(--line);color:var(--sub);padding:2px 7px;margin-bottom:10px;letter-spacing:.1em;
}
.qcard .qtext{font-size:.95rem;line-height:1.8;margin-bottom:14px}
.choice{
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--line);background:var(--paper);
  padding:11px 12px;margin-bottom:9px;cursor:pointer;
  font-size:.9rem;line-height:1.65;
}
.choice .n{font-family:var(--mono);font-weight:700;color:var(--sub);min-width:1.1em}
.choice:active{background:#EEF3F7}
.choice.sel-ok{border:2px solid var(--ok);background:#EDF6F1}
.choice.sel-ok .n{color:var(--ok)}
.choice.sel-ng{border:2px solid var(--accent);background:#FAF0ED}
.choice.sel-ng .n{color:var(--accent)}
.choice.reveal{border-style:dashed;border-color:var(--ok)}
.choice.locked{pointer-events:none;opacity:.92}
.choice.pick{border:2px solid var(--ink);background:#EEF3F7}
.qimg{display:block;width:100%;height:auto;border:1px solid var(--grid)}

/* ── ○×形式 ── */
.oxstem{font-size:.74rem;color:var(--sub);line-height:1.6;margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.oxrow{display:flex;gap:10px}
.oxrow .choice{flex:1;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;margin-bottom:0}
.oxrow .choice .mk{font-family:var(--mono);font-size:1.7rem;font-weight:700;line-height:1.2}
.oxrow .choice .lb{font-size:.72rem;color:var(--sub)}
.judge .ref{font-size:.78rem;color:var(--sub)}
.cat .stat.ox{border-top:none;margin-top:2px;padding-top:0}
.countdown{font-family:var(--mono);font-size:.72rem;color:var(--accent);text-align:center;font-weight:700;letter-spacing:.06em;margin:-10px 0 16px}
.modebtn.danger{color:var(--accent);border-style:dashed;font-weight:400;font-size:.8rem;text-align:center;padding:10px 12px}

.judge{
  margin:12px 0 0;padding:12px;border:1.5px solid;
  font-size:.86rem;line-height:1.75;background:var(--card);
}
.judge.ok{border-color:var(--ok)}
.judge.ng{border-color:var(--accent)}
.judge .stamp{
  font-family:var(--mono);font-weight:700;letter-spacing:.18em;font-size:.8rem;
  display:inline-block;border:2px solid;border-radius:50%;
  width:52px;height:52px;line-height:48px;text-align:center;
  margin-bottom:8px;transform:rotate(-8deg);
}
.judge.ok .stamp{color:var(--ok);border-color:var(--ok)}
.judge.ng .stamp{color:var(--accent);border-color:var(--accent)}
.judge .exp{margin-top:4px;color:var(--ink)}
.judge .exp b{color:var(--accent)}

.btnrow{display:flex;gap:10px;margin-top:16px}
button{
  flex:1;font-family:inherit;font-size:.9rem;font-weight:700;
  padding:13px 10px;border:1.5px solid var(--ink);
  background:var(--ink);color:#fff;cursor:pointer;
}
button.ghost{background:var(--card);color:var(--ink)}
button:active{transform:translate(1px,1px)}

/* ── 問題一覧 ── */
.qlrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:10px 12px;margin-bottom:7px;cursor:pointer;font-size:.8rem}
.qlrow:active{transform:translate(1px,1px)}
.qlrow.cur{border:1.5px solid var(--ink)}
.qlrow .no{font-family:var(--mono);font-weight:700;color:var(--sub)}
.qlrow .st{font-family:var(--mono);font-weight:700;min-width:1.2em;text-align:center}
.qlrow .st.ok{color:var(--ok)}
.qlrow .st.ng{color:var(--accent)}
.qlrow .st.un{color:var(--line)}
.qlrow .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}

/* ── 結果 ── */
.result{background:var(--card);border:2px solid var(--ink);padding:20px 16px;text-align:center}
.result .big{font-family:var(--mono);font-size:2.2rem;font-weight:700;margin:8px 0 2px}
.result .big small{font-size:1rem;color:var(--sub)}
.result .msg{font-size:.85rem;color:var(--sub);margin-bottom:6px;line-height:1.7}
.result .pass{color:var(--ok);font-weight:700}
.result .fail{color:var(--accent);font-weight:700}
.note{font-size:.68rem;color:var(--sub);line-height:1.7;margin-top:22px;border-top:1px dashed var(--line);padding-top:10px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="titleblock">
    <div class="name">
      <div class="small">2級建築施工管理技術検定</div>
      <h1>第一次検定 演習ドリル</h1>
    </div>
    <div class="no">
      <div class="dwg">DWG.No</div>
      <div class="num">SK-01</div>
      <div class="date">R8.11.08</div>
    </div>
  </div>

  <!-- ホーム -->
  <div id="home">
    <div class="dim">
      <div class="dimline"><span class="tick"></span><span class="fill" id="totalFill" style="width:0%"></span></div>
      <div class="label" id="totalLabel">全45問 ─ 学習済 0問</div>
    </div>
    <div class="countdown hidden" id="countdown"></div>
    <div id="catList"></div>
    <div class="modecard" id="exCard" style="margin-top:22px">
      <h2>過去問（年度別）</h2>
      <div class="meta">各回50問を本試験の問題番号順に出題</div>
      <div id="exRows"></div>
    </div>
    <div class="modecard">
      <h2>横断メニュー</h2>
      <div class="meta" id="xStat"></div>
      <div id="xBtns"></div>
    </div>
    <div class="note">
      オリジナル問題45問（解説つき）と、過去問500問（令和3年度前期〜令和8年度前期の10回分。令和6年度前期は未収録）を収録しています。過去問には解説がありません。本試験は50問中40問解答、合格基準の目安は得点率60%です。<br>
      ※学習記録はこの端末のブラウザ内にのみ保存されます。
    </div>
  </div>

  <!-- 出題モード選択 -->
  <div id="mode" class="hidden">
    <div class="modecard">
      <h2 id="mCat"></h2>
      <div class="meta" id="mStat"></div>
      <div id="mBtns"></div>
    </div>
    <div class="btnrow"><button class="ghost" onclick="goHome()">分野一覧へ</button></div>
  </div>


  <!-- 出題 -->
  <div id="quiz" class="hidden">
    <div class="qhead">
      <span class="catname" id="qCat"></span>
      <span id="qNo"></span>
    </div>
    <div class="dim">
      <div class="dimline"><span class="tick"></span><span class="fill" id="qFill" style="width:0%"></span></div>
      <div class="label" id="qLabel"></div>
    </div>
    <div class="qcard">
      <div class="form" id="qForm"></div>
      <div class="qtext" id="qText"></div>
      <div id="qChoices"></div>
      <div id="qJudge"></div>
    </div>
    <div class="btnrow">
      <button class="ghost" id="prevBtn" onclick="prevQ()">◀ 前へ</button>
      <button class="ghost" onclick="openList()">一覧</button>
      <button id="nextBtn" class="hidden" onclick="nextQ()">次へ ▶</button>
    </div>
  </div>

  <!-- 問題一覧 -->
  <div id="qlist" class="hidden">
    <div class="qhead">
      <span class="catname" id="lCat"></span>
      <span id="lStat"></span>
    </div>
    <div id="qlRows"></div>
    <div class="btnrow">
      <button class="ghost" onclick="goHome()">分野一覧へ</button>
      <button onclick="backToQ()">出題にもどる</button>
    </div>
  </div>

  <!-- 結果 -->
  <div id="done" class="hidden">
    <div class="result">
      <div class="small" style="font-family:var(--mono);font-size:.68rem;color:var(--sub);letter-spacing:.14em">RESULT</div>
      <div class="big" id="rScore"></div>
      <div class="msg" id="rMsg"></div>
    </div>
    <div class="btnrow">
      <button class="ghost" onclick="goHome()">分野一覧へ</button>
      <button id="retryBtn" onclick="retryWrong()">間違いだけ再挑戦</button>
    </div>
  </div>

</div>

<script src="kakomon.js"></script>
<script>
/* =========================================================
   問題データ（オリジナル問題）　※過去問は kakomon.js の PAST
   cat: smk=施工管理法 / ab=能力問題(五肢) / sek=施工 / hk=法規 / kg=建築学
   a: 正解の選択肢番号(0始まり)。配列なら「2つ選べ」形式
   以下は任意：
   e: 解説（過去問には無い）　ex/no: 過去問の試験回・問題番号　img: 図表つき問題の画像
   id: 学習記録のキー（省略時は配列の並び順。途中に問題を挿入するなら必ず付ける）
   ox: ○×形式への展開方法 "neg"=正解肢が× / "pos"=正解肢が○ / false=展開しない
       （省略時は設問文から自動判定。「不適当なもの・誤っているもの」→neg、「適当なもの・正しいもの」→pos）
   ce: 選択肢ごとの解説の配列（○×形式で優先表示）
========================================================= */
const QS0=[
/* ── 施工管理法（必須・四肢） ── */
{cat:"smk",q:"仮設計画に関する記述として、最も不適当なものはどれか。",c:["仮設計画は、安全の基本となるため、労働安全衛生法等の関係法令に適合させる。","仮囲いの出入口は、施工上支障のない限り、通行人や交通量の少ない位置に設ける。","仮設計画は、設計図書に特別の定めがない限り、発注者の承認を受けなければ定めることができない。","仮設の電力や給排水の計画では、本設備の一部を工事用として使用することも検討する。"],a:2,e:"仮設計画は、特別の定めがない限り<b>施工者がその責任において定める</b>のが原則です。安全・法令適合(1)、出入口の位置(2)、本設備の利用検討(4)はいずれも適切な考え方です。"},
{cat:"smk",q:"工事の事前調査に関する記述として、最も不適当なものはどれか。",c:["敷地内の排水計画のため、前面道路の公共桝や下水道本管の位置を調査した。","山留め計画のため、隣接建物の基礎の状況や地下埋設物を調査した。","揚重機の設置計画のため、敷地上空の架空電線の有無を調査した。","解体工事の騒音対策のため、近隣調査は工事着手後に行うこととした。"],a:3,e:"近隣調査（騒音・振動の影響、家屋の現況など）は<b>工事着手前</b>に行い、苦情や紛争を予防するのが目的です。着手後では対策も紛争予防も間に合いません。"},
{cat:"smk",q:"工事に関する届出・許可とその提出先の組合せとして、最も不適当なものはどれか。",c:["道路使用許可申請 ── 警察署長","道路占用許可申請 ── 警察署長","特定建設作業実施届 ── 市町村長","クレーン設置届（つり上げ荷重3t以上） ── 労働基準監督署長"],a:1,e:"道路<b>占用</b>許可（足場や仮囲いが道路にはみ出す等）の申請先は<b>道路管理者</b>です。道路<b>使用</b>許可（警察署長）との違いは頻出なので、「占用＝管理者、使用＝警察」とセットで覚えましょう。"},
{cat:"smk",q:"バーチャート工程表に関する記述として、最も不適当なものはどれか。",c:["縦軸に作業名、横軸に暦日をとり、作業ごとの実施期間を横線で表す。","作成が容易で、各作業の開始時期・終了時期が視覚的に分かりやすい。","各作業相互の関連や、工期に影響する作業がどれかを把握しやすい。","出来高の累計を重ねて表示すれば、工事全体の進捗の概要を把握できる。"],a:2,e:"バーチャートの弱点はまさに<b>作業間の関連（前後関係）や重点管理すべき作業が分かりにくい</b>ことです。それを補うのがネットワーク工程表です。長所と短所を対で覚えると、どちらの形式で出題されても対応できます。"},
{cat:"smk",q:"ネットワーク工程表に関する記述として、最も不適当なものはどれか。",c:["クリティカルパスは、開始から終了までの経路のうち最も日数の長い経路である。","クリティカルパス上の作業は、他の経路上の作業よりも余裕時間が多い。","クリティカルパス上の作業が遅れると、工期全体の遅れに直結する。","クリティカルパスは、工事の進捗によって他の経路に移ることがある。"],a:1,e:"クリティカルパス上の作業は<b>トータルフロート（余裕時間）が0</b>で、余裕が最もありません。だからこそ重点管理の対象になります。「最長経路＝余裕ゼロ＝遅れ厳禁」と因果でつなげて覚えましょう。"},
{cat:"smk",q:"工程計画に関する記述として、最も不適当なものはどれか。",c:["山積工程表における山崩しは、労務や資機材の投入量を平準化するために行う。","工程計画では、作業員や資機材の調達状況など施工条件を考慮する。","タクト工程は、同一作業を繰り返す工事に適さないため、基準階のある高層建物では用いない。","工程短縮のためには、作業の並行作業化や班編成の増強などを検討する。"],a:2,e:"タクト工程はまさに<b>同種の作業を繰り返す工事（基準階が続く高層建物の内装など）に適した</b>手法です。各階を一定リズム（タクト）で流していくイメージで覚えると忘れません。"},
{cat:"smk",q:"品質管理に用いる図表の説明として、最も不適当なものはどれか。",c:["ヒストグラムは、データの分布の形やばらつきの状態を把握するのに用いる。","特性要因図は、結果とそれに影響する要因の関係を魚の骨状に整理したものである。","パレート図は、2種類のデータの相関関係の有無を把握するのに用いる。","管理図は、工程が安定した状態にあるかどうかを把握するのに用いる。"],a:2,e:"2種類のデータの相関を見るのは<b>散布図</b>です。パレート図は不良項目などを件数の多い順に並べ累積曲線を重ねたもので、<b>重点管理すべき項目</b>を見つけるための図です。QC七つ道具は「何のための図か」で整理しましょう。"},
{cat:"smk",q:"品質管理のための試験・検査に関する記述として、最も不適当なものはどれか。",c:["レディーミクストコンクリートの受入れ時に、スランプ試験を行った。","鉄筋のガス圧接部の検査として、超音波探傷試験を行った。","高力ボルトの締付け検査として、ナットの回転量を確認した。","吹付けロックウールによる耐火被覆の厚さ確認として、目視のみで検査を行った。"],a:3,e:"耐火被覆の厚さは目視では確認できないため、<b>確認ピンの挿入</b>などにより厚さを測定して検査します。「性能に直結する数値は測って確かめる」のが品質検査の原則です。"},
{cat:"smk",q:"単管足場に関する記述として、最も不適当なものはどれか。",c:["建地の間隔は、けた行方向1.85m以下、はり間方向1.5m以下とした。","高さ2mの作業場所に、幅40cmの作業床を設けた。","墜落防止のため、高さ85cmの手すりと中桟を設けた。","作業床の床材間の隙間を5cmとした。"],a:3,e:"作業床の床材間の隙間は<b>3cm以下</b>と定められています。工具や材料の落下、足の踏み抜きを防ぐためです。「幅40cm以上・隙間3cm以下・手すり85cm以上＋中桟」は数値セットで暗記必須です。"},
{cat:"smk",q:"建設現場の安全管理に関する記述として、最も不適当なものはどれか。",c:["元請と下請の労働者が混在する現場で、作業間の連絡調整を行うための協議組織を設置した。","移動式クレーンの作業では、あらかじめ定めた合図を用いて作業を行った。","新たに雇い入れた労働者に対し、従事する業務に関する安全衛生教育を行った。","作業主任者の選任が必要な作業で、作業主任者の氏名の周知を省略した。"],a:3,e:"作業主任者を選任したときは、その<b>氏名と行わせる事項を作業場の見やすい箇所に掲示するなどして周知</b>しなければなりません。選任して終わりではなく「誰が指揮するか」を全員が分かる状態にすることが目的です。"},
{cat:"smk",q:"工事現場における材料の保管に関する記述として、最も不適当なものはどれか。",c:["袋詰めセメントは、吸湿しないよう風通しの良い場所に保管した。","鉄筋は、直接地面に置かず受材の上に置き、シートで養生した。","板ガラスは、縦置きにして保管した。","塗料は、密栓のうえ火気を避けて保管した。"],a:0,e:"セメントは空気中の湿気を吸って固まる（風化する）ため、<b>風通しの良い場所は不適切</b>で、防湿に留意した倉庫等に保管します。「なぜダメか＝吸湿するから」と理由で覚えると迷いません。"},
{cat:"smk",q:"施工計画に関する記述として、最も不適当なものはどれか。",c:["総合施工計画書は、工事全体の施工方針や仮設計画などをまとめたものである。","工種別施工計画書は、主要な工種について施工方法や品質管理方法を定めたものである。","施工計画の作成にあたり、過去の同種工事の実績や資料を参考にした。","施工計画書は、工事完了後に発注者へ提出するために作成するものである。"],a:3,e:"施工計画書は<b>着工前に作成し、工事を適切に進めるための計画書</b>です。完了後の提出書類ではありません。「いつ・何のために作るか」を問う形での出題が多い項目です。"},
/* ── 能力問題（必須・五肢択一） ── */
{cat:"ab",q:"工程管理に関する記述として、最も不適当なものはどれか。",c:["工程計画は、品質・原価・安全との関連を考慮して立てる。","ネットワーク工程表では、各作業の余裕時間を把握できる。","バーチャート工程表は、ネットワーク工程表に比べて作成が容易である。","工程の進捗管理では、実施工程を計画工程と比較し、遅れがあれば原因を調査して対策を講じる。","工程が計画より進んでいる場合は、原因の検討を行う必要はない。"],a:4,e:"工程が進みすぎている場合も、<b>手抜かりや品質低下、後工程との不整合がないか原因を確認</b>する必要があります。工程管理は「計画との差異はプラスでもマイナスでも検討する」が原則です。"},
{cat:"ab",q:"品質管理に関する記述として、最も不適当なものはどれか。",c:["品質管理は、施工の各段階で行うプロセス管理を重視する。","検査で不合格となった場合は、その原因を調べて再発防止の処置をとる。","品質計画には、品質の目標や管理の方法などを定める。","施工品質の確認は、後工程に隠れてしまう部分を優先的に行う。","品質管理を徹底するほど、検査の頻度や項目は多いほど常に経済的である。"],a:4,e:"検査を増やすほどコストと手間が増えるため、<b>重要度に応じて管理項目や頻度に重点を置く</b>のが品質管理の考え方です。「すべてを同じ密度で」ではなく重点管理、という思想はパレート図とも通じます。"},
{cat:"ab",q:"墜落・飛来落下災害の防止に関する記述として、最も不適当なものはどれか。",c:["高さ2m以上の作業床の端部に、手すり等を設けた。","作業床の設置が困難な箇所では、防網を張り、要求性能墜落制止用器具を使用させた。","高さ3mの場所から不要材を投下するため、投下設備を設けず監視人のみを配置した。","スレート屋根上の作業のため、幅30cm以上の歩み板を設けた。","足場上の作業で、工具の落下防止のため幅木を設けた。"],a:2,e:"高さ<b>3m以上</b>から物を投下するときは、<b>投下設備を設け、監視人を置く</b>必要があります。監視人だけでは飛散を防げません。「3m以上＝投下設備＋監視人」のセットで覚えましょう。"},
{cat:"ab",q:"コンクリートの打込み・締固めに関する記述として、最も不適当なものはどれか。",c:["練混ぜから打込み終了までの時間は、外気温が高いほど短くする。","内部振動機（棒形振動機）の挿入間隔は、60cm以下とした。","内部振動機は、コンクリートの横流しに使用してはならない。","打重ねは、先に打ち込んだコンクリートが完全に硬化してから行う。","内部振動機は、加振後ゆっくり引き抜き、穴が残らないようにする。"],a:3,e:"打重ねは先に打ったコンクリートが硬化する前、<b>一体化できる時間内（外気温25℃以下で150分以内、25℃超で120分以内が目安）</b>に行います。硬化後に打つと打継ぎ（コールドジョイント）になり一体性が失われます。"},
{cat:"ab",q:"建設副産物に関する記述として、最も不適当なものはどれか。",c:["建設発生土は、廃棄物処理法上の産業廃棄物に該当しない。","現場で発生したコンクリート塊は、再資源化の対象となる特定建設資材廃棄物である。","産業廃棄物の運搬を委託する場合、産業廃棄物管理票（マニフェスト）を交付する。","建設リサイクル法の特定建設資材には、木材が含まれる。","建設リサイクル法の特定建設資材には、鋼材が含まれる。"],a:4,e:"特定建設資材は<b>①コンクリート、②コンクリート及び鉄から成る建設資材、③木材、④アスファルト・コンクリート</b>の4つで、鋼材単独は含まれません。鋼材はもともと市場価値が高くリサイクルが進んでいるため対象外、と理由ごと覚えると確実です。"},
/* ── 施工（躯体・仕上げ） ── */
{cat:"sek",q:"地業工事に関する記述として、最も不適当なものはどれか。",c:["砂利地業の締固めは、ランマーなどの機器を用いて行った。","砂利地業に用いる砕石は、粒度の適切なものを使用した。","捨てコンクリートは、墨出しや配筋作業のために設けた。","砂利地業の厚さが厚い場合、全厚を一度にまとめて締め固めた。"],a:3,e:"地業が厚い場合は<b>層状に分けて締め固め</b>ます。一度に厚く敷くと下部まで締固めが届かず、支持力不足や沈下の原因になります。「厚い→分けて締める」は土工事共通の原則です。"},
{cat:"sek",q:"場所打ちコンクリート杭工事に関する記述として、最も不適当なものはどれか。",c:["アースドリル工法では、安定液を用いて孔壁の崩壊を防止する。","掘削完了後、孔底のスライム（沈殿物）を除去した。","コンクリートの打込みは、トレミー管を用いて行った。","トレミー管の先端は、コンクリート中に埋め込まず、常にコンクリート上面より上に保った。"],a:3,e:"トレミー管の先端は<b>常にコンクリート中に2m以上埋め込んだ状態</b>を保ちます。先端が出るとコンクリートが泥水中を落下して材料分離を起こすためです。「なぜ埋めるか＝分離防止」で覚えましょう。"},
{cat:"sek",q:"鉄筋工事に関する記述として、最も不適当なものはどれか。",c:["鉄筋のかぶり厚さは、コンクリートの中性化や火災から鉄筋を保護するために確保する。","ガス圧接継手では、圧接部のふくらみの直径を鉄筋径の1.4倍以上とした。","径の差が大きく異なる鉄筋同士でも、ガス圧接継手とすることができる。","鉄筋相互のあきは、コンクリートが行き渡るよう粗骨材の最大寸法等に応じて確保する。"],a:2,e:"ガス圧接は原則として<b>鉄筋径の差が7mm以下</b>の場合に適用します（一部例外あり）。径差が大きいと健全な圧接部が得られません。かぶり厚さの「目的」(1)も頻出なのでセットで押さえましょう。"},
{cat:"sek",q:"型枠工事に関する記述として、最も不適当なものはどれか。",c:["型枠は、コンクリートの側圧に耐えられるよう緊結金物等で固定した。","柱・壁のせき板は、コンクリートの圧縮強度が所定の値に達したことを確認して取り外した。","支保工の存置期間は、せき板の存置期間より短くてよいので、スラブ下の支柱を先に取り外した。","型枠の組立て精度は、コンクリート躯体の精度に直接影響する。"],a:2,e:"スラブ下・梁下の<b>支保工（支柱）は、せき板より長く存置</b>するのが原則です。支柱は自重や施工荷重を支えているため、強度が十分に発現する前に外すとたわみや崩壊につながります。"},
{cat:"sek",q:"コンクリート工事の打継ぎに関する記述として、最も不適当なものはどれか。",c:["梁・スラブの鉛直打継ぎ位置は、スパンの中央付近に設けた。","柱・壁の水平打継ぎ位置は、スラブや梁の上端に設けた。","打継ぎ面は、レイタンスを除去し、散水して湿潤にしてから打ち継いだ。","梁の鉛直打継ぎ位置は、せん断力の大きい柱際に設けた。"],a:3,e:"打継ぎ位置は<b>せん断力の小さい位置＝梁・スラブならスパン中央付近</b>に設けます。柱際はせん断力が最大となるため打継ぎには最も不適です。「弱点となる継ぎ目は、力の小さい所へ」が原則です。"},
{cat:"sek",q:"鉄骨工事の高力ボルト摩擦接合に関する記述として、最も不適当なものはどれか。",c:["摩擦面は、すべり係数が確保できるよう黒皮を除去し赤錆状態とした。","1群のボルトの締付けは、群の端部から中央に向かって行った。","締付けは、一次締め、マーキング、本締めの順で行った。","ナット回転法による本締め後、マーキングのずれにより共回りの有無を確認した。"],a:1,e:"1群のボルトは<b>中央から端部（周辺）に向かって</b>締め付けます。端から締めると板の間に浮きが残り、密着が得られないためです。「中→外」へ空気を追い出すイメージで覚えましょう。"},
{cat:"sek",q:"アスファルト防水工事に関する記述として、最も不適当なものはどれか。",c:["ルーフィングの継目の重ね幅は、100mm以上とした。","出隅・入隅には、増張りを行った。","ルーフィングは、水下側から水上側に向かって張り上げた。","ルーフィングの継目は、上下層で同一箇所にそろえて張り重ねた。"],a:3,e:"継目は<b>上下層で同一箇所に重ならないようずらして</b>張ります。継目がそろうとそこが弱点となり漏水経路になりやすいためです。水下から張る(3)のは、重ね目が水の流れに逆らわないようにするためです。"},
{cat:"sek",q:"タイル張り工事に関する記述として、最も不適当なものはどれか。",c:["改良圧着張りでは、下地面とタイル裏面の両方に張付けモルタルを塗って張り付けた。","密着張りでは、振動工具（ヴィブラート）を用いてタイルを張り付けた。","張付けモルタルは、一度に広い面積に塗り付け、時間をかけて張り進めた。","施工後、打診検査によりタイルの浮きの有無を確認した。"],a:2,e:"張付けモルタルは<b>塗置き時間が長くなると接着力が低下</b>するため、一度に塗る面積はタイルを張り終えられる範囲（2㎡程度以内が目安）に限定します。剥落事故の主要因になるポイントです。"},
{cat:"sek",q:"左官工事（セメントモルタル塗り）に関する記述として、最も不適当なものはどれか。",c:["塗り厚が大きい場合は、数回に分けて塗り重ねた。","下塗りは、上塗りよりも貧調合のモルタルとした。","下塗り後、ひび割れを発生させてから次の塗り付けを行うため、一定期間放置した。","各層の塗り厚は、1回につき7mm程度以下とした。"],a:1,e:"調合は<b>下塗りを富調合（セメント多め）、上塗りを貧調合</b>とします。下地側を強く、表面側をやわらかくすることで、収縮によるひび割れや剥離を防ぐためです。「下強・上弱」と覚えましょう。"},
{cat:"sek",q:"塗装工事に関する記述として、最も不適当なものはどれか。",c:["塗装場所の気温が5℃以下であったため、塗装作業を中止した。","湿度が85%以上であったため、塗装作業を中止した。","素地ごしらえとして、汚れや付着物を除去した。","乾燥を早めるため、下塗りが乾燥する前に直ちに上塗りを行った。"],a:3,e:"各層は<b>十分乾燥させてから次の層を塗り重ね</b>ます。乾燥前に塗ると、しわ・膨れ・乾燥不良の原因になります。低温(1)・多湿(2)時の中止基準「5℃以下・85%以上」は数値で覚える定番です。"},
{cat:"sek",q:"内装工事（せっこうボード張り）に関する記述として、最も不適当なものはどれか。",c:["軽量鉄骨下地へのねじ留め間隔は、ボード周辺部を中間部より小さくした。","ドリリングタッピンねじは、ボード表面より少し沈むまで確実にねじ込んだ。","GL工法では、接着材を下地に点付けし、ボードを圧着して張り付けた。","ボードの突付け部分の目地処理は、ジョイントコンパウンドと補強テープを用いず塗装のみで仕上げた。"],a:3,e:"継目（ジョイント）部は<b>補強テープとジョイントコンパウンドで目地処理</b>してから仕上げます。処理を省くと継目にひび割れが生じます。周辺部のねじ間隔を密にする(1)のは端部の固定力を高めるためです。"},
{cat:"sek",q:"シーリング工事に関する記述として、最も不適当なものはどれか。",c:["目地深さの調整のため、バックアップ材を装填した。","ワーキングジョイントでは、シーリング材を目地底に接着させる3面接着とした。","被着面の接着性を高めるため、プライマーを塗布した。","充填後、へらで押さえて表面を平滑に仕上げた。"],a:1,e:"ムーブメントの大きいワーキングジョイントは<b>2面接着</b>とします。3面接着にすると目地の動きにシーリング材が追従できず破断するためで、バックアップ材やボンドブレーカーはこの3面接着を防ぐ目的で入れます。"},
/* ── 法規 ── */
{cat:"hk",q:"建設業法上の技術者制度に関する記述として、最も不適当なものはどれか。",c:["建設業者は、請け負った建設工事を施工するときは、原則として主任技術者を置かなければならない。","請負金額が小さい工事であれば、主任技術者を置かなくてよい。","主任技術者は、施工計画の作成、工程管理、品質管理その他の技術上の管理を行う。","一定の要件を満たす場合、専任の主任技術者は複数の工事を兼任できることがある。"],a:1,e:"主任技術者は<b>請負金額の大小にかかわらず</b>配置が必要です。金額要件があるのは「専任」や「監理技術者」の話であり、混同を狙った出題が定番です。"},
{cat:"hk",q:"建設工事の請負契約書に記載しなければならない事項として、建設業法上、定められていないものはどれか。",c:["工事内容","請負代金の額","工事着手の時期及び工事完成の時期","現場代理人の氏名"],a:3,e:"現場代理人の氏名は<b>契約書の法定記載事項ではありません</b>（選任時に通知する事項）。工事内容・請負代金・着手/完成時期・支払方法などが法定記載事項です。"},
{cat:"hk",q:"建築基準法上の手続きに関する記述として、最も不適当なものはどれか。",c:["確認済証の交付を受けた後でなければ、確認を要する建築工事に着手できない。","建築主は、工事完了後、完了検査を申請しなければならない。","完了検査の申請は、工事が完了した日から4日以内に建築主事等に到達するように行う。","完了検査の申請は、工事施工者が自らの名義で行わなければならない。"],a:3,e:"完了検査の申請者は<b>建築主</b>です（手続きを代理させることは可能）。確認申請〜完了検査の一連の手続きは「誰が・いつまでに」を整理して覚えましょう。"},

function allQs(){return QS.map((q,i)=>({...q,gi:(q.id!==undefined?q.id:i)}));}
function qsOf(id){return allQs().filter(q=>q.cat===id||q.ex===id);} // id は分野または試験回
function ansOf(q){return Array.isArray(q.a)?q.a:[q.a];}
function isAns(q,i){return ansOf(q).includes(i);}
function selOk(q,sel){const a=ansOf(q),s=[].concat(sel);return s.length===a.length&&s.every(x=>a.includes(x));}
function srcTag(q){const e=EXAMS.find(x=>x.id===q.ex);return e?`${e.short} No.${q.no} ・ `:"";}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ── ○×形式：各選択肢を1問ずつの正誤問題に展開する ── */
const OX_TAIL=/、?(最も)?(不適当な|適当な|誤っている|正しい|定められていない|規定されていない)もの(はどれか|を2つ選べ)。?$/;
function oxType(q){
  if(q.ox!==undefined)return q.ox;
  if(q.img||!q.c.every(s=>/。$/.test(s)))return false; // 図表問題・語句だけの選択肢は対象外
  if(/(不適当な|誤っている|定められていない|規定されていない)もの/.test(q.q))return "neg";
  if(/(適当な|正しい)もの/.test(q.q))return "pos";
  return false;
}
// ○×の呼び方 [○側, ×側]
function oxWords(q){
  if(/誤っているもの|正しいもの/.test(q.q))return ["正しい","誤り"];
  if(/(定められていない|規定されていない)もの/.test(q.q))return ["定められている","定められていない"];
  return ["適当","不適当"];
}
function oxOf(qs){
  const out=[];
  qs.forEach(q=>{
    const t=oxType(q);if(!t)return;
    q.c.forEach((s,i)=>out.push({...q,ci:i,truth:(t==="neg"?!isAns(q,i):isAns(q,i)),key:q.gi+"-"+i}));
  });
  return out;
}
// 未回答・不正解を優先しつつ、○と×がほぼ半々になるよう n問を選ぶ
function pickOx(qs,n){
  const all=oxOf(qs);
  const pri=shuffle(all.filter(s=>store.ox[s.key]!==1)).concat(shuffle(all.filter(s=>store.ox[s.key]===1)));
  const ng=pri.filter(s=>!s.truth).slice(0,Math.ceil(n/2));
  const ok=pri.filter(s=>s.truth).slice(0,n-ng.length);
  return shuffle(ng.concat(ok));
}

function renderHome(){
  const list=document.getElementById("catList");
  list.innerHTML="";
  let doneAll=0;
  CATS.forEach(c=>{
    const qs=qsOf(c.id);
    const done=qs.filter(q=>store.res[q.gi]!==undefined).length;
    const ok=qs.filter(q=>store.res[q.gi]===1).length;
    const p=store.pos[c.id];
    const resume=(p>0&&p<qs.length)?"・続きあり":"";
    const ox=oxOf(qs);
    const oxDone=ox.filter(s=>store.ox[s.key]!==undefined).length;
    const oxOk=ox.filter(s=>store.ox[s.key]===1).length;
    doneAll+=done;
    const div=document.createElement("div");
    div.className="cat";
    div.innerHTML=`<span class="rank ${c.cls}">${c.rank}</span>
      <h2>${c.name}</h2>
      <div class="meta">${c.form}／${c.meta}</div>
      <div class="stat"><span>全${qs.length}問</span><span class="done">${done>0?`学習済 ${done}問・正解 ${ok}問${resume}`:"未着手"}</span></div>
      <div class="stat ox"><span>○× ${ox.length}問</span><span class="done">${oxDone>0?`正解 ${oxOk}問`:"未着手"}</span></div>`;
    div.onclick=()=>openCat(c.id);
    list.appendChild(div);
  });
  const pct=Math.round(doneAll/QS.length*100);
  document.getElementById("totalFill").style.width=pct+"%";
  document.getElementById("totalLabel").textContent=`全${QS.length}問 ─ 学習済 ${doneAll}問（${pct}%）`;
  renderExams();
  renderCountdown();
  renderCross();
}

function renderCountdown(){

function renderCross(){
  const all=allQs(),ox=oxOf(all);
  const miss=all.filter(q=>store.res[q.gi]===0);
  const oxOk=ox.filter(s=>store.ox[s.key]===1).length;
  document.getElementById("xStat").textContent=`全分野から出題 ─ ○× 正解 ${oxOk} / ${ox.length}問`;
  const box=document.getElementById("xBtns");box.innerHTML="";
  const cross=name=>{curCat={id:null,name:name};};
  addModeBtn("○×で解く（全分野）",`選択肢を1つずつ正誤判定。未回答・不正解を優先して ${OX_N}問`,()=>{cross("全分野 ○×");startRun(pickOx(all,OX_N),0,"rand","ox");},true,box);
  addModeBtn("ランダム出題（全分野）",`全分野からランダムに ${RAND_N}問を出題します`,()=>{cross("全分野ランダム");startRun(shuffle(all).slice(0,RAND_N),0,"rand");},false,box);
  if(miss.length>0){
    addModeBtn("間違えた問題だけ復習",`全分野の不正解 ${miss.length}問をランダム順に出題します`,()=>{cross("不正解の復習");startRun(shuffle(miss),0,"rand");},false,box);
  }
  const r=addModeBtn("学習記録をリセット","",resetAll,false,box);
  r.classList.add("danger");
}

function resetAll(){

  store={res:{},pos:{},ox:{}};save();renderHome();
}

function show(id){["home","mode","quiz","qlist","done"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0);}

function openCat(id){
  curCat=CATS.find(c=>c.id===id)||EXAMS.find(e=>e.id===id);
  const qs=qsOf(id);
  const done=qs.filter(q=>store.res[q.gi]!==undefined).length;
  const ok=qs.filter(q=>store.res[q.gi]===1).length;
  const weak=qs.filter(q=>store.res[q.gi]!==1);
  const p=store.pos[id];
  const hasResume=(p>0&&p<qs.length);
  document.getElementById("mCat").textContent=curCat.name;
  document.getElementById("mStat").textContent=`全${qs.length}問 ─ 学習済 ${done}問・正解 ${ok}問`;
  const box=document.getElementById("mBtns");box.innerHTML="";
  if(hasResume){
    addModeBtn("続きから解く",`前回の続き Q.${String(p+1).padStart(2,"0")} から再開します`,()=>startRun(qs,p,"all"),true);
  }
  if(weak.length>0&&done>0){
    addModeBtn("苦手優先で解く",`未回答・不正解の ${weak.length}問だけを出題します`,()=>startRun(weak,0,"weak"),!hasResume);
  }
  addModeBtn("最初から全問解く",`Q.01 から全${qs.length}問を順に出題します`,()=>startRun(qs,0,"all"),!hasResume&&!(weak.length>0&&done>0));
  if(qs.length>RAND_N){
    addModeBtn(`ランダムで${RAND_N}問解く`,`全${qs.length}問の中からランダムに ${RAND_N}問を出題します`,()=>startRun(shuffle(qs).slice(0,RAND_N),0,"rand"));
  }
  const ox=oxOf(qs);
  if(ox.length>0){
    const oxOk=ox.filter(s=>store.ox[s.key]===1).length;
    const n=Math.min(OX_N,ox.length);
    addModeBtn("○×で解く",`選択肢を1つずつ正誤判定。未回答・不正解を優先して ${n}問（正解 ${oxOk} / ${ox.length}問）`,()=>startRun(pickOx(qs,OX_N),0,"rand","ox"));
  }
  show("mode");
}

function addModeBtn(title,sub,fn,primary,box){
  const d=document.createElement("div");
  d.className="modebtn"+(primary?" primary":"");
  d.innerHTML=`${title}<span class="sub">${sub}</span>`;
  d.onclick=fn;
  (box||document.getElementById("mBtns")).appendChild(d);
  return d;
}

function startRun(list,start,mode,type){
  if(list.length===0)return;
  cur=list;idx=start;curMode=mode;curType=type||"mc";wrong=[];
  sessSel={};resumeBase=(mode==="all"?start:0);
  correct=0;
  for(let i=0;i<start;i++){if(store.res[cur[i].gi]===1)correct++;}
  show("quiz");renderQ();
}

function renderQ(){
  const q=cur[idx];
  document.getElementById("qCat").textContent=curCat.name;
  document.getElementById("qNo").textContent=`Q.${String(idx+1).padStart(2,"0")} / ${String(cur.length).padStart(2,"0")}`;
  document.getElementById("qFill").style.width=(idx/cur.length*100)+"%";
  document.getElementById("qLabel").textContent=`${idx+1}問目 ─ 正解 ${correct}`;
  document.getElementById("prevBtn").style.visibility=(idx>0?"visible":"hidden");
  if(curType==="ox"){renderOx(q);return;}
  const need=ansOf(q).length;
  document.getElementById("qForm").textContent=srcTag(q)+(need>1?`四肢二択（${need}つ選ぶ）`:(q.c.length===5?"五肢択一":"四肢択一"));
  const qt=document.getElementById("qText");
  if(q.img){ // 図表つき問題は問題用紙の画像で表示
    qt.innerHTML="";
    const im=document.createElement("img");im.className="qimg";im.src=q.img;im.alt=q.q;
    qt.appendChild(im);
  }else{qt.textContent=q.q;}
  const box=document.getElementById("qChoices");box.innerHTML="";
  const selNow=sessSel[idx];
  const past=(curMode==="all"&&idx<resumeBase&&store.res[q.gi]!==undefined);
  q.c.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="choice";
    d.innerHTML=`<span class="n">${i+1}</span><span>${t}</span>`;
    if(selNow!==undefined){ // このセッションで回答済み → 選んだ選択肢を再現
      d.classList.add("locked");
      const picked=selNow.includes(i);
      if(picked&&isAns(q,i))d.classList.add("sel-ok");
      else if(picked)d.classList.add("sel-ng");
      else if(isAns(q,i))d.classList.add("reveal");
    }else if(past){ // 前回セッションで回答済み → 正答と解説を表示
      d.classList.add("locked");
      if(isAns(q,i))d.classList.add(store.res[q.gi]===1?"sel-ok":"reveal");
    }else{
      d.onclick=()=>answer(i,d);
    }
    box.appendChild(d);
  });
  if(selNow!==undefined){showJudge(q,selOk(q,selNow),"");}
  else if(past){showJudge(q,store.res[q.gi]===1,"（前回の回答）");}
  else{document.getElementById("qJudge").innerHTML="";}
  const nb=document.getElementById("nextBtn");
  nb.classList.toggle("hidden",!(selNow!==undefined||past));
  nb.textContent=(idx===cur.length-1?"結果を見る":"次へ ▶");
}

/* ── ○×形式の出題 ── */
function renderOx(q){
  const w=oxWords(q);
  document.getElementById("qForm").textContent=srcTag(q)+"○×問題";
  const qt=document.getElementById("qText");qt.innerHTML="";
  const stem=document.createElement("div");stem.className="oxstem";
  stem.textContent=q.q.replace(OX_TAIL,"")+` ─ 次の記述は${w[0]}か。`;
  const body=document.createElement("div");body.innerHTML=q.c[q.ci];
  qt.appendChild(stem);qt.appendChild(body);
  const box=document.getElementById("qChoices");box.innerHTML="";
  const row=document.createElement("div");row.className="oxrow";
  const selNow=sessSel[idx];
  [[true,"○",w[0]],[false,"×",w[1]]].forEach(([v,mk,lb])=>{
    const d=document.createElement("div");
    d.className="choice";
    d.innerHTML=`<span class="mk">${mk}</span><span class="lb">${lb}</span>`;
    if(selNow!==undefined){
      d.classList.add("locked");
      if(v===selNow)d.classList.add(selNow===q.truth?"sel-ok":"sel-ng");
      else if(v===q.truth)d.classList.add("reveal");
    }else{
      d.onclick=()=>answerOx(v);
    }
    row.appendChild(d);
  });
  box.appendChild(row);
  if(selNow!==undefined){showJudgeOx(q,selNow===q.truth);}
  else{document.getElementById("qJudge").innerHTML="";}
  const nb=document.getElementById("nextBtn");
  nb.classList.toggle("hidden",selNow===undefined);
  nb.textContent=(idx===cur.length-1?"結果を見る":"次へ ▶");
}

function oxExp(q){
  if(q.ce&&q.ce[q.ci])return q.ce[q.ci];
  const e=q.e||"";
  if(isAns(q,q.ci))return e;
  const w=oxWords(q);
  return `<span class="ref">【参考】同じ設問で「${oxType(q)==="neg"?w[1]:w[0]}」にあたる記述：${ansOf(q).map(i=>"「"+q.c[i]+"」").join("")}</span>${e?"<br>"+e:""}`;
}

function showJudgeOx(q,ok){
  document.getElementById("qJudge").innerHTML=`<div class="judge ${ok?"ok":"ng"}">
     <div class="stamp">${ok?"合":"否"}</div>
     <div>${ok?"正解です。":"不正解。"}この記述は【${q.truth?"○ "+oxWords(q)[0]:"× "+oxWords(q)[1]}】です。</div>
     <div class="exp">${oxExp(q)}</div></div>`;
}

function answerOx(v){
  const q=cur[idx];
  const ok=(v===q.truth);
  if(ok)correct++;else wrong.push(q);
  sessSel[idx]=v;
  store.ox[q.key]=ok?1:0;
  save();
  renderOx(q);
}

function showJudge(q,ok,tag){
  document.getElementById("qJudge").innerHTML=`<div class="judge ${ok?"ok":"ng"}">
     <div class="stamp">${ok?"合":"否"}</div>
     <div>${ok?"正解です。":"不正解。正解は【"+ansOf(q).map(x=>x+1).join("・")+"】です。"}${tag}</div>
     <div class="exp">${q.e||""}</div></div>`;
}

function answer(i,el){
  const q=cur[idx],need=ansOf(q).length;
  let sel=[i];
  if(need>1){ // 2つ選ぶ問題：必要数がそろったら採点
    el.classList.toggle("pick");
    sel=[];
    document.querySelectorAll("#qChoices .choice").forEach((n,k)=>{if(n.classList.contains("pick"))sel.push(k);});
    if(sel.length<need)return;
  }
  const ok=selOk(q,sel);
  if(ok)correct++;else wrong.push(q);
  sessSel[idx]=sel;
  store.res[q.gi]=ok?1:0;
  if(curMode==="all"){store.pos[curCat.id]=Math.max(store.pos[curCat.id]||0,idx+1);}
  save();
  renderQ();
}

function nextQ(){
  idx++;
  if(idx<cur.length){renderQ();}
  else{finish();}
}

function prevQ(){
  if(idx>0){idx--;renderQ();}
}

function openList(){
  document.getElementById("lCat").textContent=curCat.name;
  const box=document.getElementById("qlRows");box.innerHTML="";
  let answered=0;
  cur.forEach((q,i)=>{
    let st="un",mk="−";
    if(sessSel[i]!==undefined){const o=(curType==="ox"?sessSel[i]===q.truth:selOk(q,sessSel[i]));st=o?"ok":"ng";mk=o?"○":"✕";answered++;}
    else if(curMode==="all"&&i<resumeBase&&store.res[q.gi]!==undefined){const o=(store.res[q.gi]===1);st=o?"ok":"ng";mk=o?"○":"✕";answered++;}
    const d=document.createElement("div");
    d.className="qlrow"+(i===idx?" cur":"");
    d.innerHTML=`<span class="no">Q.${String(i+1).padStart(2,"0")}</span><span class="st ${st}">${mk}</span><span class="tx">${curType==="ox"?q.c[q.ci]:q.q}</span>`;
    d.onclick=()=>{idx=i;show("quiz");renderQ();};
    box.appendChild(d);
  });
  document.getElementById("lStat").textContent=`回答 ${answered} / ${cur.length}`;
  show("qlist");
}

function backToQ(){show("quiz");renderQ();}

function finish(){
  if(curMode==="all"){delete store.pos[curCat.id];save();}
  const total=cur.length,rate=Math.round(correct/total*100);
  document.getElementById("rScore").innerHTML=`${correct}<small> / ${total}問（${rate}%）</small>`;
  const msg=document.getElementById("rMsg");
  if(rate>=60){msg.innerHTML=`<span class="pass">合格ライン（60%）クリア。</span><br>間違えた問題の解説だけ読み直して次の分野へ。`;}
  else{msg.innerHTML=`<span class="fail">合格ラインまであと少し。</span><br>間違いだけ再挑戦して、解説の「なぜ」を確認しましょう。`;}
  document.getElementById("retryBtn").classList.toggle("hidden",wrong.length===0);
  show("done");
}

function retryWrong(){
  cur=[...wrong];idx=0;correct=0;wrong=[];curMode="retry";
  show("quiz");renderQ();
}

function goHome(){renderHome();show("home");}

renderHome();
</script>
