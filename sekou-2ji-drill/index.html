<style>
:root{
  --paper:#eef2f4; --sheet:#fbfcfc; --ink:#1f3242; --ink2:#5a6b78;
  --line:#d6dee3; --grid:#e3e9ed; --accent:#6f94ae; --accent-soft:#dfe9f0;
  --ok:#7fb58f; --ok-soft:#e4f1e7; --ng:#d9927f; --ng-soft:#f7e6e0;
  --warn:#d8b56a; --warn-soft:#f7efd9;
  --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
header{padding:14px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--ink2);letter-spacing:.08em}
.countdown{text-align:right;font-size:11px;color:var(--ink2);line-height:1.2}
.countdown b{display:block;font-family:var(--mono);font-size:24px;color:var(--ink);font-weight:600}
nav{position:sticky;top:0;z-index:5;background:rgba(238,242,244,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .tabs{display:flex;max-width:720px;margin:0 auto}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 2px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 12px 80px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px 14px;margin-bottom:14px;box-shadow:0 1px 0 rgba(31,50,66,.04)}
.sheet h2{margin:0 0 10px;font-size:14px;color:var(--ink2);font-weight:600}
.src{font-size:12px;color:var(--ink2);margin-bottom:8px;padding-left:10px;border-left:3px solid var(--accent)}
.qtext{font-size:16px;line-height:2;word-break:break-all}
.blank{display:inline-block;min-width:4.5em;padding:0 8px;margin:0 2px;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:3px;font-weight:600;cursor:pointer;line-height:1.7;text-align:center;font-family:inherit;font-size:inherit;color:var(--ink);border-top:0;border-left:0;border-right:0}
.blank.cur{outline:2px solid var(--accent);outline-offset:2px}
.blank.empty{color:var(--ink2);font-weight:400}
.blank.ok{background:var(--ok-soft);border-bottom-color:var(--ok)}
.blank.ng{background:var(--ng-soft);border-bottom-color:var(--ng);text-decoration:line-through}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.choices button,.btn{font:inherit;font-size:15px;padding:12px 10px;border:1px solid var(--line);background:var(--sheet);border-radius:6px;color:var(--ink);cursor:pointer;text-align:center}
.choices button:active,.btn:active{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.wide{width:100%;margin-top:12px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.hint{font-size:13px;color:var(--ink2);margin-top:8px}
.result{margin-top:12px;padding:12px;border-radius:6px;font-size:14px}
.result.ok{background:var(--ok-soft)}
.result.ng{background:var(--ng-soft)}
.result .ans{font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--sheet);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:8px}
.prog{height:4px;background:var(--grid);border-radius:2px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
svg.gantt{width:100%;height:auto;display:block;font-family:var(--sans)}
svg.gantt text{font-size:11px;fill:var(--ink)}
svg.gantt .mono{font-family:var(--mono);fill:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 4px;text-align:right;white-space:nowrap}
.tbl th{background:var(--accent-soft);font-weight:600;text-align:center}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl td.q{color:var(--accent);font-weight:700;text-align:center}
.tbl tr.total td{background:#f3f6f8;font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{padding:10px 4px;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600}
.stat span{font-size:11px;color:var(--ink2)}
.weak{list-style:none;margin:8px 0 0;padding:0}
.weak li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.weak li .num{color:var(--ng);font-weight:600}
label.f{display:block;font-size:13px;color:var(--ink2);margin-top:10px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);margin-top:4px}
textarea{min-height:110px;line-height:1.7}
.custom-list{margin-top:10px;font-size:13px}
.custom-list div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.custom-list button{background:none;border:0;color:var(--ng);font:inherit;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--ink2);padding:30px 10px;font-size:14px}
.pt{margin-top:10px;font-size:13px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px}

.card{position:relative;min-height:190px;padding:18px 16px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);cursor:pointer;box-shadow:0 1px 0 rgba(31,50,66,.04)}
.card .cat{font-size:11px;color:var(--ink2);letter-spacing:.06em}
.card .term{font-size:22px;font-weight:700;margin:6px 0 4px;line-height:1.4}
.card .tap{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--accent)}
.card h3{font-size:12px;color:var(--ink2);margin:12px 0 4px;font-weight:600;padding-left:8px;border-left:3px solid var(--accent)}
.card p{margin:0;font-size:14px;line-height:1.75}
.card ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.75}
.termlist{list-style:none;margin:0;padding:0}
.termlist li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.termlist li b{display:block}
.termlist li span{font-size:13px;color:var(--ink2)}
.chip.fl{font-size:11px;padding:3px 9px;margin-left:6px;vertical-align:middle}
.chip.fl.on{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.lawlist .ans{color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent)}
.last{opacity:.7}
.ex{background:#f3f6f8;border-radius:6px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.7}
.ex b{color:var(--accent)}
.cnt{font-size:11px;color:var(--ink2);text-align:right;margin-top:2px}
.cnt.over{color:var(--ng)}
.chk{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.chk li{padding:5px 0;border-bottom:1px dashed var(--line)}
.chk li.ok::before{content:'✓ ';color:var(--ok);font-weight:700}
.chk li.ng::before{content:'△ ';color:var(--ng);font-weight:700}
.setbox{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:10px}
.setbox h3{margin:0;font-size:13px;color:var(--ink2)}
textarea.s{min-height:64px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{id:'T02',term:'ベンチマーク',cat:'仮設',d:'建物の高さおよび位置の基準となる点。既存の工作物や移動のおそれのない場所に設ける。',n:'2か所以上設けて相互に照合できるようにする；工事中に動いたり損傷しないよう養生し、定期的に確認する'},

{id:'T05',term:'足場の手すり先行工法',cat:'仮設',d:'枠組足場の組立て時、作業床に上がる前に上の層の手すりを先行して取り付け、解体時も作業床を外すまで手すりを残す工法。',n:'手すりのない作業床には立ち入らない；組立て・解体は足場の組立て等作業主任者の指揮のもとで行う'},
{id:'T06',term:'乗入れ構台',cat:'仮設',d:'根切り工事中に、掘削機やダンプを地上から根切り内へ乗り入れるために設ける仮設の作業構台。',n:'使用する重機の荷重で構造計算し、スロープ勾配は1/10〜1/6程度とする；支柱は山留めの切梁や本設の基礎・柱と干渉しない位置に計画する'},
{id:'T07',term:'防護棚（朝顔）',cat:'仮設',d:'工事現場からの落下物から通行人などを守るため、外部足場の外側に突き出して設ける棚。',n:'突き出し長さは2m以上、水平面から20°以上の角度で、隙間なく設ける；高さ10m以上は1段以上、20m以上は2段以上設ける'},
{id:'T08',term:'ローリングタワー',cat:'仮設',d:'脚部にキャスターを付けて移動できるようにした枠組足場（移動式足場）。',n:'作業中はキャスターをロックし、人を乗せたまま移動しない；アウトリガーを設け、高さは設置面の状況に応じた制限内とする'},
{id:'T09',term:'床付け',cat:'土工事',d:'根切りを設計の深さまで掘り、底面を平らに仕上げること。',n:'床付け面を乱さないよう最後は手掘りや平刃バケットで仕上げる；乱した場合は砂・砂利で置き換えて転圧する'},
{id:'T10',term:'釜場排水',cat:'土工事',d:'根切り底の一部に集水用のピット（釜場）を設け、集まった地下水をポンプで排出する排水工法。',n:'釜場は基礎・基礎梁から離れた位置に設ける；湧水量が多い場合はボイリングを起こすおそれがあるので、ウェルポイント等の他工法を検討する'},
{id:'T11',term:'ヒービング',cat:'土工事',d:'軟弱な粘性土地盤で、山留め壁背面の土の重量によって根切り底面が膨れ上がる現象。',n:'山留め壁を良質な地盤まで十分に根入れする；地盤改良や掘削の分割・底盤コンクリートの早期打設で対応する'},
{id:'T12',term:'ボイリング',cat:'土工事',d:'砂質地盤で、根切り内外の地下水位差により根切り底から水と砂が湧き上がり、地盤が支持力を失う現象。',n:'ディープウェル等で根切り外の地下水位を下げる；山留め壁の根入れを深くして水の回り込みを長くする'},
{id:'T13',term:'腹起し・切梁',cat:'土工事',d:'山留め壁が受ける土圧を支えるため、壁面に沿って水平に取り付ける部材が腹起し、腹起し同士を突っ張る部材が切梁。',n:'切梁にはプレロードを導入して山留め壁の変位を抑える；取付け前に深く掘り下げず、撤去は下層の底盤・床が完成してから順に行う'},
{id:'T14',term:'プレボーリング工法（既製杭）',cat:'杭',d:'アースオーガーであらかじめ掘削し、根固め液・杭周固定液を注入した孔に既製杭を建て込む工法。',n:'掘削中のオーガー電流値や排出土で支持層への到達を確認する；杭の建込み後、空掘り部分は速やかに埋め戻す'},
{id:'T15',term:'スライム処理',cat:'杭',d:'場所打ちコンクリート杭で、孔底に沈殿した掘りくず（スライム）を除去すること。',n:'掘削直後の一次処理と、コンクリート打設直前の二次処理を行う；処理後はトレミー管で連続してコンクリートを打設する'},
{id:'T16',term:'鉄筋のかぶり厚さ',cat:'鉄筋',d:'鉄筋の表面からコンクリート表面までの最短距離。耐久性・耐火性・付着に関わる。',n:'設計かぶり厚さは最小かぶり厚さに施工誤差10mmを加えて確保する；スペーサーで保持し、型枠に接する面や開口周りは特に確認する'},

{id:'T18',term:'鉄筋の重ね継手',cat:'鉄筋',d:'鉄筋の端部を所定の長さ重ね合わせ、結束線で結束して力を伝える継手。',n:'継手は応力の小さい位置に設け、隣接する継手は相互にずらす；重ね長さは径・コンクリート強度に応じた長さ（例：40d）とし、D35以上には用いない'},
{id:'T19',term:'ガス圧接継手',cat:'鉄筋',d:'鉄筋の端面を突き合わせ、酸素アセチレン炎で加熱しながら加圧して接合する継手。',n:'ふくらみの直径1.4d以上、長さ1.1d以上、偏心量1/5d以下などの外観検査と超音波探傷検査を行う；径の差が7mmを超える鉄筋どうしは圧接しない、有資格者が行う'},
{id:'T20',term:'鉄筋のあき',cat:'鉄筋',d:'隣り合う鉄筋の表面間の距離。コンクリートが鉄筋の間を通り充填できるように確保する。',n:'粗骨材最大寸法の1.25倍、25mm、鉄筋径の1.5倍のうち最大の値以上とする；柱・梁の交差部や継手部で不足しやすいので配筋図で確認する'},
{id:'T21',term:'セパレータ',cat:'型枠',d:'型枠のせき板の間隔を保持し、コンクリートの側圧に抵抗する締付け金物。',n:'打放し仕上げではコーン付きとし、打設後はコーン穴をモルタルで埋め、頭部は防錆処理する；間隔はコンクリート側圧の計算により決める'},
{id:'T22',term:'型枠の剥離剤',cat:'型枠',d:'型枠のせき板をコンクリートから離れやすくするために塗る油脂系などの材料。',n:'鉄筋に付着させない；塗りすぎるとコンクリート表面の変色や仕上材の付着不良の原因になる'},
{id:'T23',term:'コンクリートのスランプ',cat:'コンクリート',d:'スランプコーンを引き上げた後の頂部の下がり（cm）で表す、フレッシュコンクリートの軟らかさの指標。',n:'荷卸し時に試験し、許容差（スランプ18cmは±2.5cm）を確認する；現場で水を加えて調整してはならない'},

{id:'T26',term:'コンクリートの打継ぎ',cat:'コンクリート',d:'先に打設して硬化したコンクリートに、後から新しいコンクリートを打ち継ぐこと。',n:'梁・スラブはスパンの中央付近、柱・壁はスラブ・梁・基礎の上端に設ける；打継ぎ面のレイタンスを取り除き、散水して湿潤状態にしてから打ち継ぐ'},
{id:'T27',term:'タンピング',cat:'コンクリート',d:'スラブなどの上面を打設後、凝結前にタンパーでたたいて締め固めること。',n:'沈下ひび割れ・初期ひび割れが生じる前後に行い、ひび割れを消す；ブリーディング水を処理してから行う'},
{id:'T28',term:'コンクリートの湿潤養生',cat:'コンクリート',d:'打設後、水分の逸散を防ぐため散水・シート覆い・養生マットなどで湿潤状態に保つこと。',n:'普通ポルトランドセメントで5日以上、早強で3日以上保つ；直射日光・風を避け、寒中は初期凍害を受けないよう保温する'},
{id:'T29',term:'コンクリートの締固め',cat:'コンクリート',d:'棒形振動機などで気泡を追い出し、型枠内の隅々までコンクリートを密実に充填すること。',n:'挿入間隔は60cm以下、1か所5〜15秒程度、鉛直に挿入して先端を先に打った層に10cm程度入れる；引き抜くときはゆっくりと、穴が残らないようにする'},
{id:'T30',term:'高力ボルト摩擦接合',cat:'鉄骨',d:'高力ボルトで母材を強く締め付け、接合面に生じる摩擦力で応力を伝える接合方法。',n:'摩擦面は黒皮・塗料・油を除去してすべり係数0.45以上を確保する；一次締め→マーキング→本締めの順で、ボルト群の中央から端部へ締め付ける'},

{id:'T34',term:'ベースモルタル',cat:'鉄骨',d:'鉄骨柱脚のベースプレート下に、建方精度を確保するため敷く無収縮モルタル。',n:'あと詰め中心塗り工法では建方の3日前までに施工し養生する；厚さ30〜50mm、大きさ200〜300mm角程度とする'},

{id:'T38',term:'ALCパネル縦壁ロッキング構法',cat:'外装',d:'縦張りのALCパネルを上下の取付金物で1点ずつ固定し、層間変位に対してパネルが回転して追従できるようにする構法。',n:'パネル間の目地は伸縮目地としてシーリング材を充填する；パネルへの設備開口は構造上の制限内とし、無理に切欠かない'},
{id:'T39',term:'改良圧着張り',cat:'タイル',d:'下地とタイル裏面の両方に張付けモルタルを塗り付け、タイルをたたき押さえて張る工法。',n:'張付けモルタルは1回の塗付け面積2m²以内とし、塗り置き時間30分以内で張る；タイルはたたき押さえてモルタルを裏面全体に密着させる'},
{id:'T40',term:'伸縮調整目地',cat:'タイル',d:'温度変化や乾燥収縮による躯体・タイルの動きを吸収するため、外壁タイル面に設ける目地。',n:'3〜4m間隔程度で縦横に設け、躯体のひび割れ誘発目地の位置と合わせる；目地にはシーリング材を充填する'},

/* ================= 状態・保存 ================= */
const KEY='sekou2ji_v1';
let store={stats:{},customLaw:[],customKnow:[],customTerm:[],customSekou:[],flags:{},essay:{}};
try{const s=localStorage.getItem(KEY);if(s)store=Object.assign(store,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){toast('保存できませんでした（ブラウザの保存領域を確認）');}}
function rec(id,ok){const s=store.stats[id]||{ok:0,ng:0,streak:0};if(ok){s.ok++;s.streak++;}else{s.ng++;s.streak=0;}s.last=ok?1:0;store.stats[id]=s;save();}
function isWeak(id){const s=store.stats[id];return s&&(s.ng>0&&s.streak<2);}
function allLaw(){return LAW_Q.concat(store.customLaw);}
function allKnow(){return KNOW_Q.concat(store.customKnow);}
function allTerm(){return TERMS.concat(store.customTerm);}
function allSekou(){return SEKOU_Q.concat(store.customSekou);}
const R7_LAST=['T22','T42','T09','T49','T50','T51','T52','T53','T54','T55','T56','T57','T58','T59','L25','L26','L27','P35','P36','P37','P38','P39','P40','P41','P42','P43','P44','P45','P46','P47','P48','P49','P50'];
if(store.flagsInit!=='r7'){if(!store.flags)store.flags={};R7_LAST.forEach(id=>store.flags[id]=1);store.flagsInit='r7';save();}
function isLast(id){return !!(store.flags&&store.flags[id]);}
function toggleFlag(id){if(!store.flags)store.flags={};if(store.flags[id])delete store.flags[id];else store.flags[id]=1;save();}
/* 昨年出題は後ろへ（excl=trueなら除外） */
function order(pool,excl){const a=shuffle(pool);return excl?a.filter(q=>!isLast(q.id)):a.filter(q=>!isLast(q.id)).concat(a.filter(q=>isLast(q.id)));}
function flagBtn(id){return `<button class="chip fl ${isLast(id)?'on':''}" data-fl="${id}">${isLast(id)?'昨年出題':'昨年出題にする'}</button>`;}
function bindFlags(cb){app.querySelectorAll('[data-fl]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFlag(b.dataset.fl);cb();});}
function exclChips(state){return `<h2>昨年出題した問題</h2><div class="filters"><button class="chip ${!state.excl?'on':''}" data-x="0">後回しで出す</button><button class="chip ${state.excl?'on':''}" data-x="1">出さない</button></div>`;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

let law={filter:'all',mode:'all',excl:false,list:false,queue:[],idx:0,fill:[],cur:0,done:false};
function renderLaw(){
  if(law.list)return renderLawList();
  if(!law.queue.length)return renderLawStart();
  const q=law.queue[law.idx];
  if(!q)return renderLawEnd();
  const filled=law.fill.every(v=>v!==null);
  let html=`<div class="meta"><span>${esc(q.law)}</span><span class="num">${law.idx+1} / ${law.queue.length}</span></div>
  <div class="prog"><i style="width:${(law.idx/law.queue.length*100)}%"></i></div>
  <div class="sheet"><div class="src">${esc(q.art)}</div><div class="qtext">`;
  let k=0;
  html+=q.text.split(/(\{\{\d+\}\})/).map(part=>{
    const m=part.match(/^\{\{(\d+)\}\}$/);
    if(!m)return esc(part);
    const i=+m[1];const v=law.fill[i];
    let cls='blank';if(law.done)cls+=v===q.blanks[i].a?' ok':' ng';else if(i===law.cur)cls+=' cur';if(v===null)cls+=' empty';
    return `<button class="${cls}" data-b="${i}">${v===null?'（'+(i+1)+'）':esc(v)}</button>`;
  }).join('');
  html+=`</div>`;
  if(!law.done){
    const b=q.blanks[law.cur];
    html+=`<div class="hint">空欄（${law.cur+1}）に入る語句を選ぶ</div><div class="choices">`+
      law.choiceOrder[law.cur].map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join('')+`</div>
      <button class="btn primary wide" id="judge" ${filled?'':'disabled'}>答え合わせ</button>`;
  }else{
    const allOk=law.fill.every((v,i)=>v===q.blanks[i].a);
    html+=`<div class="result ${allOk?'ok':'ng'}">${allOk?'正解':'不正解'}　正答：<span class="ans">${q.blanks.map(b=>esc(b.a)).join('／')}</span></div>
      ${q.pt?`<div class="pt">${esc(q.pt)}</div>`:''}
      <button class="btn primary wide" id="next">次の問題</button>`;
  }
  html+=`</div><button class="btn wide" id="quit" style="margin-top:0">中断してメニューへ</button>`;
  app.innerHTML=html;
  app.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{if(law.done)return;law.cur=+b.dataset.b;renderLaw();});
  app.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{law.fill[law.cur]=b.dataset.c;const nx=law.fill.findIndex(v=>v===null);if(nx>=0)law.cur=nx;renderLaw();});
  const j=document.getElementById('judge');if(j)j.onclick=()=>{law.done=true;const ok=law.fill.every((v,i)=>v===q.blanks[i].a);rec(q.id,ok);renderLaw();};
  const n=document.getElementById('next');if(n)n.onclick=()=>{law.idx++;setupLawQ();renderLaw();};
  document.getElementById('quit').onclick=()=>{law.queue=[];renderLaw();};
}
function setupLawQ(){const q=law.queue[law.idx];if(!q)return;law.fill=q.blanks.map(()=>null);law.cur=0;law.done=false;law.choiceOrder=q.blanks.map(b=>shuffle(b.c));}
function renderLawStart(){
  const laws=['all','建設業法','建築基準法','労働安全衛生法'];
  const pool=lawPool();
  app.innerHTML=`<div class="sheet"><h2>出題範囲</h2><div class="filters">${laws.map(l=>`<button class="chip ${law.filter===l?'on':''}" data-f="${l}">${l==='all'?'すべて':l}</button>`).join('')}</div>
  <h2>出題方法</h2><div class="filters">
    <button class="chip ${law.mode==='all'?'on':''}" data-m="all">全問（シャッフル）</button>
    <button class="chip ${law.mode==='weak'?'on':''}" data-m="weak">苦手のみ</button>
    <button class="chip ${law.mode==='new'?'on':''}" data-m="new">未着手のみ</button></div>
  ${exclChips(law)}
  <div class="hint">対象 <span class="num">${order(pool,law.excl).length}</span> 問（うち昨年出題 <span class="num">${pool.filter(q=>isLast(q.id)).length}</span>）</div>
  <button class="btn primary wide" id="start" ${order(pool,law.excl).length?'':'disabled'}>開始</button>
  <button class="btn wide" id="list">問題一覧を見る</button></div>
  <div class="sheet"><h2>解き方</h2><div class="hint">条文中の空欄を順にタップし、下の語群から選びます。全部埋めると「答え合わせ」が押せます。間違えた問題は「苦手」に入り、2回連続正解で外れます。</div></div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{law.filter=b.dataset.f;renderLawStart();});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{law.mode=b.dataset.m;renderLawStart();});
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{law.excl=b.dataset.x==='1';renderLawStart();});
  document.getElementById('start').onclick=()=>{law.queue=order(pool,law.excl);law.idx=0;setupLawQ();renderLaw();};
  document.getElementById('list').onclick=()=>{law.list=true;renderLaw();};
}
function renderLawList(){
  const pool=allLaw().filter(q=>law.filter==='all'||q.law.indexOf(law.filter)===0);
  app.innerHTML=`<div class="sheet"><h2>法規 問題一覧（${law.filter==='all'?'すべて':esc(law.filter)}・${pool.length}問）</h2><div class="hint">正答を埋めた状態で表示。「昨年出題にする」を押すと出題順が後ろになります（出さない設定も可）。</div>
  <ul class="termlist lawlist">${pool.map(q=>{const s=store.stats[q.id];return `<li class="${isLast(q.id)?'last':''}"><b>${esc(q.art)}${flagBtn(q.id)}${isWeak(q.id)?' <span class="num" style="color:var(--ng)">△</span>':''}</b><span style="color:var(--ink2);font-size:11px">${esc(q.law)}${s?`　正${s.ok}／誤${s.ng}`:''}</span><br><span style="color:var(--ink);font-size:13px">${q.text.split(/(\{\{\d+\}\})/).map(p=>{const m=p.match(/^\{\{(\d+)\}\}$/);return m?`<span class="ans">${esc(q.blanks[+m[1]].a)}</span>`:esc(p);}).join('')}</span></li>`;}).join('')}</ul>
  <button class="btn primary wide" id="back">メニューへ</button></div>`;
  bindFlags(renderLawList);
  document.getElementById('back').onclick=()=>{law.list=false;renderLaw();};
}
function lawPool(){return allLaw().filter(q=>law.filter==='all'||q.law.indexOf(law.filter)===0).filter(q=>law.mode==='all'||(law.mode==='weak'?isWeak(q.id):!store.stats[q.id]));}
function renderLawEnd(){
  const ids=law.queue.map(q=>q.id);const ok=ids.filter(id=>store.stats[id]&&store.stats[id].last===1).length;
  app.innerHTML=`<div class="sheet"><h2>終了</h2><div class="stat"><div><b>${law.queue.length}</b><span>出題</span></div><div><b>${ok}</b><span>正解</span></div><div><b>${Math.round(ok/law.queue.length*100)}</b><span>％</span></div></div>
  <button class="btn primary wide" id="again">メニューへ</button></div>`;
  document.getElementById('again').onclick=()=>{law.queue=[];renderLaw();};
}

let sc={view:'menu',si:0,qi:0,ans:null,showCalc:false,know:{queue:[],idx:0,ans:null}};
function renderSched(){
  if(sc.view==='menu')return renderSchedMenu();
  if(sc.view==='know')return renderKnow();

  if(!q){sc.view='menu';return renderSchedMenu();}

  <div class="sheet"><div class="src">${esc(s.sub)}</div><div class="scroll">${gantt(s)}</div>
  ${s.note?`<div class="hint">工事概要：${esc(s.note)}</div>`:`<div class="hint">手がかり：${s.tasks.filter(t=>t.hide).map(t=>`<b>${t.hide}</b>＝${esc(t.clue)}`).join('　')}</div>`}
  <div class="scroll">${dekidaka(s,sc.showCalc||sc.ans!==null)}</div>
  <button class="btn" style="margin-top:8px;font-size:13px;padding:6px 12px" id="calc">${sc.showCalc?'合計を隠す':'月別合計・累計を表示（答え合わせ後は自動表示）'}</button></div>
  <div class="sheet"><div class="qtext" style="line-height:1.7;font-size:15px">${esc(q.t)}</div><div class="choices" style="grid-template-columns:1fr">`;

  html+=`</div>`;

function gantt(s){
  const hasBars=s.tasks.some(t=>t.bars);
  const L=hasBars?100:118,W=hasBars?680:560,rowH=hasBars?44:24,top=30,mw=(W-L-10)/s.months.length;const H=top+s.tasks.length*rowH+14;
  let g=`<svg class="gantt" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s.months.forEach((m,i)=>{const x=L+i*mw;g+=`<line x1="${x}" y1="${top-8}" x2="${x}" y2="${H-8}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x+mw/2}" y="${top-12}" text-anchor="middle" class="mono">${m}</text>`;});
  g+=`<line x1="${L+s.months.length*mw}" y1="${top-8}" x2="${L+s.months.length*mw}" y2="${H-8}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
  s.tasks.forEach((t,i)=>{const y=top+i*rowH;
    g+=`<line x1="0" y1="${y+rowH}" x2="${W}" y2="${y+rowH}" stroke="var(--grid)"/>`;
    if(t.bars){
      g+=`<text x="6" y="${y+rowH/2+4}" font-size="10">${esc(t.n)}</text>`;
      t.bars.forEach((b,k)=>{const x1=L+(b.s-1)*mw,x2=L+(b.e-1)*mw;const up=k%2===0;const by=up?y+11:y+28;const ly=up?y+8:y+39;
        g+=`<rect x="${x1}" y="${by}" width="${Math.max(x2-x1,3)}" height="7" rx="1" fill="${b.hide?'var(--accent)':'#7f96a8'}"/>`;
        g+=`<text x="${x1}" y="${ly}" font-size="${b.hide?'11':'8'}" ${b.hide?'font-weight="700" fill="var(--accent)"':'fill="var(--ink2)"'}>${esc(b.l)}</text>`;});
    }else{const x1=L+(t.bar[0]-1)*mw,x2=L+(t.bar[1]-1)*mw;
    g+=`<text x="6" y="${y+16}" ${t.hide?'font-weight="700" fill="var(--accent)"':''}>${esc(t.hide?t.hide:t.n)}</text>`;
    g+=`<rect x="${x1}" y="${y+6}" width="${x2-x1}" height="12" rx="2" fill="${t.hide?'var(--accent)':'#b8cbd8'}"/>`;}});
  return g+`</svg>`;
}
function dekidaka(s,show){
  if(s.real)return dekidakaReal(s,show);
  const n=s.months.length;const tot=s.tasks.reduce((a,t)=>a+t.m.reduce((x,y)=>x+y,0),0);
  const monthly=s.months.map((_,i)=>s.tasks.reduce((a,t)=>a+t.m[i],0));
  let cum=0;
  let h=`<table class="tbl"><tr><th>工種</th><th>工事金額</th>${s.months.map(m=>`<th>${m}</th>`).join('')}</tr>`;
  s.tasks.forEach(t=>{const sum=t.m.reduce((x,y)=>x+y,0);h+=`<tr><td>${t.hide?'<span class="q">'+t.hide+'</span>':esc(t.n)}</td><td class="num">${sum.toLocaleString()}</td>${t.m.map(v=>`<td class="num">${v?v.toLocaleString():''}</td>`).join('')}</tr>`;});
  h+=`<tr class="total"><td>総工事金額</td><td class="num">${tot.toLocaleString()}</td>${monthly.map(v=>`<td class="num">${show?v.toLocaleString():'？'}</td>`).join('')}</tr>`;
  h+=`<tr class="total"><td>累計比率</td><td></td>${monthly.map(v=>{cum+=v;return `<td class="num">${show?(cum/tot*100).toFixed(1)+'%':'？'}</td>`;}).join('')}</tr></table><div class="hint">単位：万円</div>`;
  return h;
}
function dekidakaReal(s,show){
  const tot=s.tasks.reduce((a,t)=>a+t.m.reduce((x,y)=>x+y,0),0);
  const plan=s.months.map((_,i)=>s.tasks.reduce((a,t)=>a+t.m[i],0));
  const nR=s.tasks[0].r.length;
  const real=s.months.map((_,i)=>i<nR?s.tasks.reduce((a,t)=>a+t.r[i],0):null);
  let h=`<table class="tbl"><tr><th>工種</th><th>工事金額</th><th></th>${s.months.map(m=>`<th>${m}</th>`).join('')}</tr>`;
  s.tasks.forEach(t=>{const sum=t.m.reduce((x,y)=>x+y,0);
    h+=`<tr><td rowspan="2">${esc(t.n)}</td><td class="num" rowspan="2">${sum.toLocaleString()}</td><td style="font-size:11px">予定</td>${t.m.map(v=>`<td class="num">${v?v.toLocaleString():''}</td>`).join('')}</tr>`;
    h+=`<tr><td style="font-size:11px;color:var(--ink2)">実績</td>${s.months.map((_,i)=>`<td class="num">${i<nR&&t.r[i]?t.r[i].toLocaleString():''}</td>`).join('')}</tr>`;});
  let cp=0,cr=0;
  h+=`<tr class="total"><td rowspan="3">合計</td><td class="num" rowspan="3">${tot.toLocaleString()}</td><td style="font-size:11px">月別予定</td>${plan.map(v=>`<td class="num">${v.toLocaleString()}</td>`).join('')}</tr>`;
  h+=`<tr class="total"><td style="font-size:11px">月別実績</td>${real.map(v=>`<td class="num">${v===null?'':(show?v.toLocaleString():'？')}</td>`).join('')}</tr>`;
  h+=`<tr class="total"><td style="font-size:11px">実績累計</td>${real.map(v=>{if(v===null)return '<td></td>';cr+=v;return `<td class="num">${show?cr.toLocaleString()+'<br><span style="font-size:10px;color:var(--ink2)">'+(cr/tot*100).toFixed(1)+'%</span>':'？'}</td>`;}).join('')}</tr>`;
  if(show){h+=`<tr class="total"><td colspan="3" style="font-size:11px">予定累計（参考）</td>${plan.map(v=>{cp+=v;return `<td class="num">${cp.toLocaleString()}<br><span style="font-size:10px;color:var(--ink2)">${(cp/tot*100).toFixed(1)}%</span></td>`;}).join('')}</tr>`;}
  h+=`</table><div class="hint">単位：万円　実績は4月末時点まで</div>`;
  return h;
}

/* ================= 用語（単語帳） ================= */
let tm={cat:'all',mode:'all',excl:false,queue:[],idx:0,flip:false,list:false};
function termPool(){return allTerm().filter(t=>tm.cat==='all'||t.cat===tm.cat).filter(t=>tm.mode==='all'||(tm.mode==='weak'?isWeak(t.id):!store.stats[t.id]));}
function renderTerm(){
  if(tm.list)return renderTermList();
  if(!tm.queue.length)return renderTermStart();
  const t=tm.queue[tm.idx];
  if(!t)return renderTermEnd();
  let html=`<div class="meta"><span>${esc(t.cat)}</span><span class="num">${tm.idx+1} / ${tm.queue.length}</span></div><div class="prog"><i style="width:${tm.idx/tm.queue.length*100}%"></i></div>

  if(tm.flip){
    html+=`<h3>用語の説明</h3><p>${esc(t.d)}</p><h3>施工上の留意点</h3><ul>${t.n.split('；').map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  }else html+=`<div class="hint" style="margin-top:14px">説明と留意点を2つ、頭の中で言ってからタップ</div><div class="tap">タップで表示</div>`;
  html+=`</div>`;
  if(tm.flip)html+=`<div class="row"><button class="btn" id="ng" style="border-color:var(--ng);color:var(--ng)">あやふや</button><button class="btn primary" id="ok">言えた</button></div>`;

function renderTermStart(){
  const cats=['all'].concat([...new Set(allTerm().map(t=>t.cat))]);
  const pool=termPool();
  app.innerHTML=`<div class="sheet"><h2>分類</h2><div class="filters">${cats.map(c=>`<button class="chip ${tm.cat===c?'on':''}" data-f="${esc(c)}">${c==='all'?'すべて':esc(c)}</button>`).join('')}</div>

function essayCheck(){
  const d=essayData(es.theme);const ul=document.getElementById('chk');if(!ul)return;const r=[];
  const bad=/設備工事|電気工事|給排水|空調|配管工事|配線/;const num=/[0-9０-９]/;
  d.sets.forEach((s,i)=>{const n=i+1;
    r.push([!!s.k.trim(),`セット${n}：①工種名が書けている`]);
    r.push([s.y.trim().length>=30,`セット${n}：②が30字以上（要因＋影響を受ける作業）`]);
    r.push([num.test(s.t),`セット${n}：③に数値が入っている`]);
    r.push([!bad.test(s.y+s.t),`セット${n}：設備工事の内容を書いていない`]);});
  const ys=d.sets.map(s=>s.y.trim()).filter(Boolean),ts=d.sets.map(s=>s.t.trim()).filter(Boolean);
  r.push([new Set(ys).size===ys.length&&new Set(ts).size===ts.length,'②③が3セットで重複していない']);
  d.m.forEach((s,i)=>{r.push([!!s.h.trim()&&!!s.e.trim(),`2-${i+1}：方法と良い影響の両方が書けている`]);r.push([!ts.some(t=>t&&s.h.trim()&&(t===s.h.trim())),`2-${i+1}：1．の③と同じ内容になっていない`]);});
  r.push([d.m[0].h.trim()!==d.m[1].h.trim()||!d.m[0].h.trim(),'2．の方法が2つで異なる']);
  ul.innerHTML=r.map(([ok,t])=>`<li class="${ok?'ok':'ng'}">${esc(t)}</li>`).join('');
}

  <label class="f">解説（任意）<input type="text" id="k-e"></label>
  <button class="btn primary wide" id="k-save">保存</button>
  <div class="custom-list">${store.customKnow.map((q,i)=>`<div><span>工程　${esc(q.t).slice(0,36)}</span><button data-dk="${i}">削除</button></div>`).join('')}${store.customSekou.map((q,i)=>`<div><span>${esc(q.g)}　${esc(q.t).slice(0,36)}</span><button data-ds="${i}">削除</button></div>`).join('')}</div></div>
  <div class="sheet"><h2>用語カードを追加</h2>
  <label class="f">用語<input type="text" id="t-term"></label>
  <label class="f">分類<select id="t-cat"><option>仮設</option><option>土工事</option><option>杭</option><option>鉄筋</option><option>型枠</option><option>コンクリート</option><option>鉄骨</option><option>木工事</option><option>外装</option><option>タイル</option><option>防水</option><option>シーリング</option><option>塗装</option><option>内装</option><option>その他</option></select></label>
  <label class="f">用語の説明<textarea id="t-d" style="min-height:70px"></textarea></label>
  <label class="f">施工上の留意点（複数は「；」で区切る）<textarea id="t-n" style="min-height:70px"></textarea></label>
  <button class="btn primary wide" id="t-save">保存</button>
  <div class="custom-list">${store.customTerm.map((q,i)=>`<div><span>${esc(q.cat)}　${esc(q.term)}</span><button data-dt="${i}">削除</button></div>`).join('')}</div></div>
  <div class="sheet"><h2>バーチャート問題の追加について</h2><div class="hint">工程表とデータ表はHTML内の <code>SCHED</code> 配列に書き足すと増やせます（工種名・バーの位置・月別金額・設問）。問題集の数値を写すだけで同じ形式で出題されます。</div></div>`;
  document.getElementById('a-save').onclick=()=>{
    const text=document.getElementById('a-text').value.trim();const art=document.getElementById('a-art').value.trim();
    const parts=text.split(/【([^】]+)】/);if(parts.length<3){toast('【 】で空欄を1つ以上指定してください');return;}
    const answers=[];let t='';parts.forEach((p,i)=>{if(i%2===1){answers.push(p.trim());t+='{{'+(answers.length-1)+'}}';}else t+=p;});
    const lines=document.getElementById('a-ch').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const pool=allLaw().flatMap(q=>q.blanks.map(b=>b.a));
    const blanks=answers.map((a,i)=>{let wrong=lines[i]?lines[i].split(/[、,，]/).map(s=>s.trim()).filter(Boolean):[];
      if(wrong.length<3){const extra=shuffle(pool.filter(x=>x!==a&&wrong.indexOf(x)<0));while(wrong.length<3&&extra.length)wrong.push(extra.pop());}
      return {a:a,c:[a].concat(wrong.slice(0,3))};});
    store.customLaw.push({id:'C'+Date.now(),law:document.getElementById('a-law').value,art:art||'（条文名なし）',text:t,blanks:blanks,pt:document.getElementById('a-pt').value.trim()});
    save();toast('追加しました');renderAdd();};
  document.getElementById('k-save').onclick=()=>{
    const t=document.getElementById('k-t').value.trim();const c=document.getElementById('k-c').value.split('\n').map(s=>s.trim()).filter(Boolean);const a=parseInt(document.getElementById('k-a').value,10);
    if(!t||c.length!==4||!(a>=1&&a<=4)){toast('問題文・選択肢4つ・正答番号を確認してください');return;}
    const kind=document.getElementById('k-kind').value;const e=document.getElementById('k-e').value.trim();
    if(kind==='know')store.customKnow.push({id:'CK'+Date.now(),t:t,c:c,a:a-1,e:e});else store.customSekou.push({id:'CS'+Date.now(),g:kind,t:t,c:c,a:a-1,e:e});save();toast('追加しました');renderAdd();};
  document.getElementById('t-save').onclick=()=>{
    const term=document.getElementById('t-term').value.trim(),d=document.getElementById('t-d').value.trim(),n=document.getElementById('t-n').value.trim();
    if(!term||!d||!n){toast('用語・説明・留意点を入力してください');return;}
    store.customTerm.push({id:'CT'+Date.now(),term:term,cat:document.getElementById('t-cat').value,d:d,n:n});save();toast('追加しました');renderAdd();};
  app.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{store.customTerm.splice(+b.dataset.dt,1);save();renderAdd();});
  app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{store.customLaw.splice(+b.dataset.dl,1);save();renderAdd();});
  app.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{store.customSekou.splice(+b.dataset.ds,1);save();renderAdd();});
  app.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{store.customKnow.splice(+b.dataset.dk,1);save();renderAdd();});
}

render();
</script>
</body>
</html>
